name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The bundle has no runtime or dev dependencies, so the tests need no
      # install step: they import the plugin's own modules directly.
      - run: npm test
